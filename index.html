<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>每日待办 · 我的日程本</title>
<style>
  :root{
    --bg:#f4f1ea; --bg-soft:#faf8f2; --ink:#2c2a26; --ink-soft:#6b665d; --ink-faint:#a59e92;
    --line:#e7e1d6; --card:#ffffff; --accent:#5b8a72; --accent-deep:#3f6b54; --accent-soft:#eef3ef;
    --warn:#b5654a; --warn-soft:#f6ece8; --gold:#b8893f;
    --shadow:0 8px 28px rgba(60,52,40,.08); --radius:16px;
    --serif:"Songti SC","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);
    background:radial-gradient(1200px 600px at 80% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),linear-gradient(180deg,#f6f3ec 0%, #efeae0 100%);
    min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .logo{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:1px;}
  .brand .sub{font-size:12px;color:var(--ink-faint);letter-spacing:2px;}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sync-stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);transition:.3s;}
  .sync-dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sync-dot.busy{background:var(--gold);}
  .sync-dot.off{background:var(--warn);}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.18s;padding:0;line-height:1;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent-deep);transform:rotate(30deg);}
  .today-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.18s;}
  .today-btn:hover{border-color:var(--accent);color:var(--accent-deep);}
  .view-switch{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
  .view-switch button{border:0;background:transparent;color:var(--ink-soft);font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:.18s;font-family:var(--sans);}
  .view-switch button.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,138,114,.35);}

  .datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .datebar .nav{display:flex;align-items:center;gap:8px;}
  .datebar .arrow{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-soft);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;}
  .datebar .arrow:hover{border-color:var(--accent);color:var(--accent-deep);}
  .datebar .cur{text-align:center;min-width:200px;}
  .datebar .cur .d1{font-size:20px;font-weight:600;}
  .datebar .cur .d2{font-size:12px;color:var(--ink-faint);margin-top:2px;}

  .grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section-title{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .section-title h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.5px;}
  .section-title .meta{font-size:12px;color:var(--ink-faint);}

  .filterbar{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px;}
  .filterbar button{border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-soft);font-size:12.5px;padding:5px 13px;border-radius:999px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px;}
  .filterbar button .dot{width:8px;height:8px;border-radius:50%;}
  .filterbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filterbar button.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5);}

  .add-box{padding:0 18px 14px;}
  .add-row{display:flex;gap:10px;}
  .add-row input{flex:1;border:1px solid var(--line);background:var(--bg-soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;transition:.18s;font-family:var(--sans);}
  .add-row input:focus{border-color:var(--accent);background:#fff;}
  .cat-sel{border:1px solid var(--line);background:var(--bg-soft);border-radius:12px;padding:0 10px;font-size:13px;color:var(--ink-soft);cursor:pointer;outline:none;font-family:var(--sans);}
  .add-row button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 20px;font-size:14px;cursor:pointer;transition:.18s;white-space:nowrap;font-family:var(--sans);}
  .add-row button:hover{background:var(--accent-deep);}

  .todo-list{padding:4px 12px 16px;}
  .todo-item{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:12px;transition:.15s;position:relative;}
  .todo-item:hover{background:var(--bg-soft);}
  .todo-item + .todo-item{border-top:1px solid var(--line);}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-faint);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;}
  .chk:hover{border-color:var(--accent);}
  .chk.done{background:var(--accent);border-color:var(--accent);}
  .chk.done svg{display:block;}
  .chk svg{display:none;}
  .cat-chip{flex:0 0 auto;font-size:11px;padding:3px 9px;border-radius:999px;font-family:var(--sans);white-space:nowrap;border:1px solid transparent;-webkit-appearance:none;appearance:none;font-weight:600;cursor:pointer;outline:none;background:transparent;}
  .todo-text{flex:1;font-size:14.5px;line-height:1.45;word-break:break-word;cursor:text;}
  .todo-item.done .todo-text{color:var(--ink-faint);text-decoration:line-through;}
  .todo-edit{flex:1;border:1px solid var(--accent);border-radius:8px;padding:7px 10px;font-size:14px;outline:none;font-family:var(--sans);}
  .todo-del{opacity:.45;border:0;background:transparent;color:var(--ink-faint);font-size:16px;cursor:pointer;padding:5px 6px;border-radius:8px;transition:.15s;flex:0 0 auto;line-height:1;display:flex;align-items:center;justify-content:center;}
  .todo-item:hover .todo-del{opacity:1;}
  .todo-del:hover{color:var(--warn);background:var(--warn-soft);}
  .empty{padding:38px 18px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.8;}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5;}

  .progress{height:6px;background:var(--line);border-radius:999px;margin:6px 18px 4px;overflow:hidden;}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:999px;transition:width .3s;}
  .list-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 16px;font-size:12px;color:var(--ink-faint);}
  .link-btn{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:12px;transition:.15s;}
  .link-btn:hover{color:var(--warn);}

  .almanac{padding:18px;font-family:var(--serif);}
  .alm-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
  .alm-head .date-big{font-size:40px;font-weight:700;line-height:1;color:var(--ink);}
  .alm-head .date-sm{font-size:13px;color:var(--ink-soft);margin-top:6px;font-family:var(--sans);}
  .alm-head .seal{font-family:var(--serif);color:#fff;background:var(--warn);width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1.1;text-align:center;transform:rotate(-4deg);box-shadow:0 3px 10px rgba(181,101,74,.3);padding:4px;}
  .alm-row{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-family:var(--sans);}
  .alm-row:first-of-type{border-top:0;}
  .alm-row .k{color:var(--warn);font-size:13px;font-weight:600;font-family:var(--serif);}
  .alm-row .v{font-size:13.5px;color:var(--ink);line-height:1.6;}
  .alm-row .v .yi{color:var(--accent-deep);}
  .alm-row .v .ji{color:var(--warn);}
  .alm-pz{font-size:11.5px;color:var(--ink-faint);font-family:var(--serif);margin-top:10px;line-height:1.7;border-top:1px dashed var(--line);padding-top:10px;}

  .cal{padding:8px 14px 16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--ink-faint);padding:6px 0;font-weight:500;}
  .cal-cell{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;background:var(--bg-soft);transition:.15s;gap:1px;padding-top:8px;}
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.other{background:transparent;color:var(--ink-faint);opacity:.45;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--gold);}
  .cal-cell.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  .cal-cell.sel .lun{color:rgba(255,255,255,.85);}
  .cal-cell .num{font-size:15px;font-weight:600;font-family:var(--sans);line-height:1;}
  .cal-cell .lun{font-size:10.5px;color:var(--ink-faint);font-family:var(--serif);}
  .cal-cell .cellstat{margin-top:3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;line-height:1.2;font-family:var(--sans);}
  .cal-cell .cellstat .p{color:var(--accent-deep);font-weight:600;}
  .cal-cell .cellstat .d{color:var(--gold);font-weight:600;}
  .cal-cell.sel .cellstat .p{color:#fff;}
  .cal-cell.sel .cellstat .d{color:#ffe6c2;}

  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .cal-week .cal-cell{aspect-ratio:auto;min-height:128px;align-items:stretch;justify-content:flex-start;padding:9px 8px;cursor:default;}
  .cal-week .cal-cell .whead{display:flex;align-items:baseline;justify-content:space-between;width:100%;}
  .cal-week .cal-cell .whead .num{font-family:var(--sans);}
  .cal-week .cal-cell .whead .lun{font-size:10px;}
  .cal-week .witems{margin-top:8px;display:flex;flex-direction:column;gap:5px;width:100%;overflow:hidden;cursor:pointer;}
  .cal-week .witem{font-size:11.5px;line-height:1.3;color:var(--ink-soft);background:#fff;border-radius:6px;padding:4px 7px;border-left:3px solid var(--accent);font-family:var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center;}
  .cal-week .witem .wc{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .cal-week .witem.done{opacity:.55;text-decoration:line-through;border-left-color:var(--ink-faint);}
  .cal-week .wmore{font-size:10.5px;color:var(--ink-faint);font-family:var(--sans);padding-left:4px;}
  .cal-week .wadd{margin-top:auto;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink-faint);border-radius:8px;padding:5px;font-size:12px;cursor:pointer;transition:.15s;font-family:var(--sans);}
  .cal-week .wadd:hover{border-color:var(--accent);color:var(--accent-deep);}
  .cal-week .wstat{font-size:10px;color:var(--ink-faint);font-family:var(--sans);text-align:center;margin-top:4px;}

  .modal-mask{position:fixed;inset:0;background:rgba(44,42,38,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(2px);}
  .modal{background:var(--card);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;font-weight:600;font-family:var(--sans);}
  .modal-head .md{font-size:12px;color:var(--ink-faint);margin-top:2px;font-family:var(--sans);}
  .modal-close{border:0;background:transparent;font-size:22px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:2px 8px;border-radius:8px;}
  .modal-close:hover{background:var(--bg-soft);color:var(--ink);}
  .modal-body{overflow-y:auto;padding-bottom:8px;}

  .hidden{display:none !important;}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
    .datebar .cur{min-width:150px;}
    .brand .logo{font-size:22px;}
    .wrap{padding:16px 12px 50px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo">每日待办</span>
      <span class="sub">MY&nbsp;DAILY&nbsp;PLANNER</span>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="syncSettingsBtn" title="同步设置">⚙</button>
      <div class="sync-stat" id="syncStat" title="同步状态"><span class="sync-dot off" id="syncDot"></span><span id="syncTxt">离线</span></div>
      <button class="today-btn" id="todayBtn">回到今天</button>
      <div class="view-switch" id="viewSwitch">
        <button data-view="list" class="active">列表</button>
        <button data-view="month">月历</button>
        <button data-view="week">周历</button>
      </div>
    </div>
  </header>

  <div class="datebar">
    <div class="nav"><div class="arrow" id="prevBtn">‹</div></div>
    <div class="cur" id="curDate"></div>
    <div class="nav"><div class="arrow" id="nextBtn">›</div></div>
  </div>

  <div class="grid">
    <div class="card" id="mainCard">
      <div id="listView">
        <div class="section-title"><h2 id="listTitle">今日待办</h2><span class="meta" id="listMeta"></span></div>
        <div class="filterbar" id="filterBar"></div>
        <div class="add-box">
          <div class="add-row">
            <input id="todoInput" type="text" placeholder="添加一件待办，回车保存…" maxlength="120" />
            <select id="catSel" class="cat-sel"></select>
            <button id="addBtn">添加</button>
          </div>
        </div>
        <div class="progress" id="progress"><i style="width:0%"></i></div>
        <div class="todo-list" id="todoList"></div>
        <div class="list-foot"><span id="footStat"></span><button class="link-btn" id="clearDone">清除已完成</button></div>
      </div>

      <div id="monthView" class="hidden">
        <div class="section-title"><h2 id="monthTitle">月历</h2><span class="meta">点击日期可查看 / 编辑当天待办</span></div>
        <div class="cal">
          <div class="cal-grid" id="monthDow"></div>
          <div class="cal-grid" id="monthGrid" style="margin-top:6px;"></div>
        </div>
      </div>

      <div id="weekView" class="hidden">
        <div class="section-title"><h2 id="weekTitle">本周</h2><span class="meta">点击事项编辑 · 底部「+」快速添加</span></div>
        <div class="cal" style="padding:14px;">
          <div class="cal-week" id="weekGrid"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title"><h2>今日黄历</h2><span class="meta" id="almMeta"></span></div>
      <div class="almanac" id="almanac"></div>
    </div>
  </div>

  <div class="foot-note" id="footNote">数据保存在本机浏览器 · 开启同步服务后可在手机与电脑间实时互通</div>
</div>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="modalDate">当日待办</h3><div class="md" id="modalLun"></div></div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="add-box" style="padding-top:12px;">
        <div class="add-row">
          <input id="modalInput" type="text" placeholder="添加待办…" maxlength="120" />
          <select id="modalCatSel" class="cat-sel"></select>
          <button id="modalAdd">添加</button>
        </div>
      </div>
      <div class="progress" id="modalProgress"><i style="width:0%"></i></div>
      <div class="todo-list" id="modalList"></div>
      <div class="list-foot"><span id="modalFoot"></span><button class="link-btn" id="modalClear">清除已完成</button></div>
    </div>
  </div>
</div>

<!-- 同步设置弹窗 -->
<div class="modal-mask hidden" id="syncModal">
  <div class="modal">
    <div class="modal-head">
      <div><h3>同步设置</h3><div class="md">跨设备实时同步（不依赖同一 WiFi）</div></div>
      <button class="modal-close" id="syncModalClose">×</button>
    </div>
    <div class="modal-body" style="padding:16px 18px 20px;">
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 12px;">
        在此填入<b>同步服务根地址</b>（即运行 server.js 的地址，打开它会返回 <code style="background:var(--bg-soft);padding:1px 4px;border-radius:4px;">{"rev":0,"data":{}}</code> 这类 JSON，<b>不是网页前台地址</b>）。<br>
        手机与电脑都打开同一网页、填同一个地址，即可自动同步。<br>
        留空＝只用本机存储（不跨设备）。
      </p>
      <div class="add-row">
        <input id="syncBaseInput" type="url" placeholder="https://你的同步服务地址（需含 /api/todos 接口）" style="flex:1" />
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="today-btn" id="syncSave" style="border-color:var(--accent);color:var(--accent-deep);">保存并连接</button>
        <button class="link-btn" id="syncClear">清除</button>
      </div>
      <div id="syncTest" style="font-size:12px;color:var(--ink-faint);margin-top:10px;"></div>
    </div>
  </div>
</div>

<script src="lunar.js"></script>
<script>
"use strict";
const $=(s)=>document.querySelector(s);
const pad=(n)=>(n<10?"0":"")+n;
const fmtKey=(d)=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const WEEK_CN=["日","一","二","三","四","五","六"];
const DOW_CN=["一","二","三","四","五","六","日"];

const CATS={
  work:  {label:"工作", color:"#3b7dd8", bg:"#eaf1fb"},
  family:{label:"家庭", color:"#5b8a72", bg:"#eef3ef"},
  baby:  {label:"宝宝", color:"#d98aa8", bg:"#fbeef3"},
  self:  {label:"个人", color:"#8a6fc4", bg:"#f1ecf9"},
  other: {label:"其他", color:"#9a9389", bg:"#f1efe9"},
};
const CAT_KEYS=Object.keys(CATS);

/* ===== 状态 ===== */
const STORE_KEY="dailyTodos_v1";
let selected=new Date(); selected.setHours(0,0,0,0);
let viewMode="list";
let filterCat="all";
let modalDate=null;

/* ===== 存储 + 跨设备同步 ===== */
function loadAll(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function getDayTodos(key){ return (loadAll()[key]||[]).filter(t=>!t.deleted); }
function setDayTodos(key, list){
  const all=loadAll();
  const tomb=(all[key]||[]).filter(t=>t.deleted);
  const merged=tomb.concat(list.map(t=>({...t,deleted:false})));
  if(merged.length) all[key]=merged; else delete all[key];
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
}
// 原样保存某天全部事项（保留 deleted 标记），用于删除/清空已完成
function getAllForDay(key){ return (loadAll()[key]||[]); }
function saveDayTodos(key, list){
  const all=loadAll();
  if(list.length) all[key]=list; else delete all[key];
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
}
function mergeFromServer(serverData){
  const all=loadAll(); let changed=false;
  for(const [date,items] of Object.entries(serverData||{})){
    const map=new Map((all[date]||[]).map(t=>[t.id,t]));
    for(const t of items){
      const ex=map.get(t.id);
      if(!ex || (t.updatedAt||0)>=(ex.updatedAt||0)){ if(JSON.stringify(ex)!==JSON.stringify(t)) changed=true; map.set(t.id,t); }
    }
    const arr=[...map.values()].filter(t=>!(t.deleted && Date.now()-(t.updatedAt||0)>7*864e5));
    if(arr.length) all[date]=arr; else delete all[date];
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
  return changed;
}
let online=false, lastRev=-1, syncing=false;
const SYNC_KEY="dailyTodos_syncBase";
let syncBase=(localStorage.getItem(SYNC_KEY)||"").replace(/\/+$/,"");
function apiUrl(p){ return (syncBase?syncBase:"")+p; }
function setSyncBase(url){
  syncBase=(url||"").trim().replace(/\/+$/,"");
  if(syncBase) localStorage.setItem(SYNC_KEY,syncBase); else localStorage.removeItem(SYNC_KEY);
  lastRev=-1; setSync("busy","连接中"); pull().then(()=>push());
}
function setSync(state,txt){
  online=state!=="off";
  $("#syncDot").className="sync-dot "+(state==="on"?"on":state==="busy"?"busy":"off");
  $("#syncTxt").textContent=txt;
}
async function pull(){
  if(syncing) return;
  try{
    const r=await fetch(apiUrl("/api/todos"),{cache:"no-store"});
    if(!r.ok){ setSync("off","离线"); return; }
    const d=await r.json();
    setSync("on","已同步");
    if(d.rev!==lastRev){ const changed=mergeFromServer(d.data); lastRev=d.rev; if(changed) render(); }
  }catch(e){ setSync("off","离线"); }
}
async function push(){
  if(!online) return;
  syncing=true; setSync("busy","同步中");
  try{
    const r=await fetch(apiUrl("/api/todos"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:loadAll()})});
    if(r.ok){ const d=await r.json(); lastRev=d.rev; setSync("on","已同步"); }
    else setSync("off","离线");
  }catch(e){ setSync("off","离线"); }
  syncing=false;
}
function afterMutate(){ localStorage.setItem(STORE_KEY, JSON.stringify(loadAll())); push(); }

/* ===== 待办操作 ===== */
function stamp(t){ t.updatedAt=Date.now(); return t; }
function addTodo(text,key,cat){
  text=text.trim(); if(!text) return;
  key=key||fmtKey(selected); cat=cat||"other";
  const list=getDayTodos(key);
  list.push(stamp({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),text,done:false,cat,createdAt:Date.now()}));
  setDayTodos(key,list); afterMutate(); render();
}
function toggleTodo(id,key){
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.done=!t.done; t.doneAt=t.done?Date.now():null; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function editTodo(id,key,newText){
  newText=newText.trim(); if(!newText) return;
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.text=newText; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function setCat(id,key,cat){
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.cat=cat; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function delTodo(id,key){
  key=key||fmtKey(selected);
  const list=getAllForDay(key).map(t=>{ if(t.id===id){t.deleted=true; stamp(t);} return t; });
  saveDayTodos(key,list); afterMutate(); render();
}
function clearDone(key){
  key=key||fmtKey(selected);
  const list=getAllForDay(key).map(t=>{ if(t.done){t.deleted=true; stamp(t);} return t; });
  saveDayTodos(key,list); afterMutate(); render();
}

/* ===== 黄历 ===== */
function renderAlmanac(d){
  const solar=Solar.fromDate(d), lunar=solar.getLunar();
  const yGz=lunar.getYearInGanZhi(), sxz=lunar.getYearShengXiao();
  const mGz=lunar.getMonthInGanZhi(), dGz=lunar.getDayInGanZhi();
  const yi=lunar.getDayYi().join(" "), ji=lunar.getDayJi().join(" ");
  const chong=lunar.getDayChong(), sha=lunar.getDaySha();
  const tianshen=lunar.getDayTianShen(), nayin=lunar.getDayNaYin();
  const pz=lunar.getPengZuGan()+" "+lunar.getPengZuZhi();
  const xi=lunar.getDayPositionXi();
  const jq=lunar.getJieQi()||"";
  const fest=(lunar.getFestivals().concat(lunar.getOtherFestivals())).join(" ");
  const sfest=(solar.getFestivals&&solar.getFestivals())||[];
  const lunarStr=lunar.getYearInChinese()+"年 "+lunar.getMonthInChinese()+"月"+lunar.getDayInChinese();
  const ganzhiStr=yGz+"（"+sxz+"）年 "+mGz+"月 "+dGz+"日";
  let festLine="";
  if(jq) festLine+="【"+jq+"】";
  if(fest) festLine+=fest;
  if(sfest.length) festLine+=sfest.join(" ");
  $("#almMeta").textContent=lunar.getMonthInChinese()+"月"+lunar.getDayInChinese();
  $("#almanac").innerHTML=`
    <div class="alm-head">
      <div><div class="date-big">${d.getDate()}</div>
        <div class="date-sm">${d.getFullYear()}年${d.getMonth()+1}月 · 星期${WEEK_CN[d.getDay()]}</div></div>
      <div class="seal">生肖<br>${sxz}</div>
    </div>
    <div class="alm-row"><div class="k">农历</div><div class="v">${lunarStr}<br><span style="color:var(--ink-faint);font-size:12px">${ganzhiStr}</span></div></div>
    ${festLine?`<div class="alm-row"><div class="k">节日</div><div class="v" style="color:var(--warn)">${festLine}</div></div>`:""}
    <div class="alm-row"><div class="k">宜</div><div class="v yi">${yi||"—"}</div></div>
    <div class="alm-row"><div class="k">忌</div><div class="v ji">${ji||"—"}</div></div>
    <div class="alm-row"><div class="k">冲煞</div><div class="v">冲${chong}煞${sha}</div></div>
    <div class="alm-row"><div class="k">值神</div><div class="v">${tianshen} · 纳音${nayin}</div></div>
    <div class="alm-row"><div class="k">喜神</div><div class="v">${xi}方</div></div>
    <div class="alm-pz">彭祖百忌：${pz}</div>`;
}

/* ===== 工具 ===== */
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function checkSvg(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`; }
function trashSvg(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`; }
function catOpts(cur){ return CAT_KEYS.map(k=>`<option value="${k}" ${k===cur?"selected":""}>${CATS[k].label}</option>`).join(""); }
function buildTodoHTML(list,key){
  if(!list.length) return `<div class="empty"><div class="big">☘</div>这一天还没有安排<br>点下方或日历里的「+」添加</div>`;
  const sorted=[...list].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.createdAt-b.createdAt));
  return sorted.map(t=>{
    const c=CATS[t.cat]||CATS.other;
    return `<div class="todo-item ${t.done?"done":""}" data-id="${t.id}" data-key="${key}">
      <div class="chk ${t.done?"done":""}" data-act="toggle">${checkSvg()}</div>
      <select class="cat-chip" data-act="cat" style="background:${c.bg};color:${c.color};border-color:${c.color}" title="点击修改分类">${catOpts(t.cat)}</select>
      <div class="todo-text" data-act="edit" title="双击编辑">${escapeHtml(t.text)}</div>
      <button class="todo-del" data-act="del" title="删除">${trashSvg()}</button>
    </div>`;
  }).join("");
}
// 列表容器事件绑定（主列表与弹窗共用）
function bindList(containerId){
  const c=$("#"+containerId);
  c.addEventListener("click",e=>{
    const item=e.target.closest(".todo-item"); if(!item) return;
    const id=item.dataset.id, key=item.dataset.key, act=e.target.dataset.act;
    if(act==="toggle") toggleTodo(id,key);
    else if(act==="del") delTodo(id,key);
  });
  c.addEventListener("change",e=>{
    const sel=e.target.closest(".cat-chip"); if(!sel) return;
    const item=e.target.closest(".todo-item"); if(!item) return;
    setCat(item.dataset.id,item.dataset.key,sel.value);
  });
  c.addEventListener("dblclick",e=>{
    const txt=e.target.closest(".todo-text"); if(!txt) return;
    const item=txt.closest(".todo-item"); if(item.classList.contains("done")) return;
    startEdit(item,txt);
  });
}
function startEdit(item,txt){
  const id=item.dataset.id, key=item.dataset.key;
  const t=getDayTodos(key).find(x=>x.id===id); if(!t) return;
  const input=document.createElement("input");
  input.className="todo-edit"; input.value=t.text;
  txt.replaceWith(input); input.focus(); input.select();
  let done=false;
  const commit=()=>{ if(done) return; done=true; const v=input.value.trim(); if(v) editTodo(id,key,v); else render(); };
  input.addEventListener("blur",commit);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();input.blur();} else if(e.key==="Escape"){done=true;render();} });
}

/* ===== 列表视图 ===== */
function renderFilterBar(){
  const bar=$("#filterBar");
  const items=[["all","全部"]].concat(CAT_KEYS.map(k=>[k,CATS[k].label]));
  bar.innerHTML=items.map(([k,l])=>{
    const dot=k==="all"?"":`<span class="dot" style="background:${CATS[k].color}"></span>`;
    return `<button class="${filterCat===k?"active":""}" data-cat="${k}">${dot}${l}</button>`;
  }).join("");
}
function renderList(){
  const key=fmtKey(selected);
  let list=getDayTodos(key);
  if(filterCat!=="all") list=list.filter(t=>t.cat===filterCat);
  const done=list.filter(t=>t.done).length, total=list.length, pct=total?Math.round(done/total*100):0;
  $("#listTitle").textContent=isSameDay(selected,new Date())?"今日待办":"当日待办";
  $("#listMeta").textContent=fmtKey(selected).slice(5);
  $("#footStat").textContent=total?`共 ${total} 项 · 已完成 ${done} 项`:"";
  $("#progress").firstElementChild.style.width=pct+"%";
  $("#todoList").innerHTML=buildTodoHTML(list,key);
}

/* ===== 日历通用 ===== */
function statHTML(list){
  const total=list.length, done=list.filter(t=>t.done).length, pend=total-done;
  if(!total) return "";
  return `<div class="cellstat">${pend?`<span class="p">待${pend}</span>`:""}${done?`<span class="d">✓${done}</span>`:""}</div>`;
}
function renderMonth(){
  const y=selected.getFullYear(), m=selected.getMonth();
  $("#monthTitle").textContent=y+"年"+(m+1)+"月";
  $("#monthDow").innerHTML=DOW_CN.map(w=>`<div class="cal-dow">周${w}</div>`).join("");
  const first=new Date(y,m,1);
  const start=new Date(y,m,1); start.setDate(1-((first.getDay()+6)%7));
  const today=new Date(); today.setHours(0,0,0,0);
  const grid=$("#monthGrid"); grid.innerHTML="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=fmtKey(d), list=getDayTodos(key);
    const cell=document.createElement("div"); cell.className="cal-cell";
    if(d.getMonth()!==m) cell.classList.add("other");
    if(isSameDay(d,today)) cell.classList.add("today");
    if(isSameDay(d,selected)) cell.classList.add("sel");
    const lun=Solar.fromDate(d).getLunar();
    const lunTxt=lun.getDay()===1? lun.getMonthInChinese()+"月" : lun.getDayInChinese();
    cell.innerHTML=`<div class="num">${d.getDate()}</div><div class="lun">${lunTxt}</div>${statHTML(list)}`;
    cell.addEventListener("click",()=>openModal(d));
    grid.appendChild(cell);
  }
}
function renderWeek(){
  const monday=new Date(selected); monday.setDate(selected.getDate()-((selected.getDay()+6)%7));
  $("#weekTitle").textContent=fmtKey(monday).slice(5)+" ~ "+fmtKey(new Date(monday.getTime()+6*864e5)).slice(5);
  const grid=$("#weekGrid"); grid.innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const key=fmtKey(d), list=getDayTodos(key);
    const total=list.length, done=list.filter(t=>t.done).length;
    const cell=document.createElement("div"); cell.className="cal-cell";
    const today=new Date(); today.setHours(0,0,0,0);
    if(isSameDay(d,today)) cell.classList.add("today");
    if(isSameDay(d,selected)) cell.classList.add("sel");
    const lun=Solar.fromDate(d).getLunar();
    const lunTxt=lun.getDay()===1? lun.getMonthInChinese()+"月" : lun.getDayInChinese();
    let items="";
    list.slice(0,4).forEach(t=>{ const c=CATS[t.cat]||CATS.other; items+=`<div class="witem ${t.done?"done":""}"><span class="wc" style="background:${c.color}"></span>${escapeHtml(t.text)}</div>`; });
    if(total>4) items+=`<div class="wmore">+${total-4} 项</div>`;
    cell.innerHTML=`<div class="whead"><span class="num">${d.getDate()}</span><span class="lun">周${DOW_CN[i]}·${lunTxt}</span></div>
      <div class="witems">${items}</div>
      <button class="wadd" data-add="1">＋ 添加</button>
      ${total?`<div class="wstat">待${total-done} · 已完成${done}</div>`:""}`;
    cell.querySelector(".witems").addEventListener("click",()=>openModal(d));
    cell.querySelector(".wadd").addEventListener("click",(e)=>{ e.stopPropagation(); openModal(d,true); });
    grid.appendChild(cell);
  }
}

/* ===== 弹窗（日历内编辑当日） ===== */
function openModal(date,focusAdd){
  modalDate=new Date(date); modalDate.setHours(0,0,0,0);
  const lun=Solar.fromDate(modalDate).getLunar();
  $("#modalDate").textContent=fmtKey(modalDate).replace(/-/g,"/")+" 当日待办";
  $("#modalLun").textContent="星期"+WEEK_CN[modalDate.getDay()]+" · "+lun.getMonthInChinese()+"月"+lun.getDayInChinese();
  $("#modalMask").classList.remove("hidden");
  renderModal();
  if(focusAdd) setTimeout(()=>$("#modalInput").focus(),60);
}
function closeModal(){ modalDate=null; $("#modalMask").classList.add("hidden"); }
function renderModal(){
  if(!modalDate) return;
  const key=fmtKey(modalDate);
  let list=getDayTodos(key);
  if(filterCat!=="all") list=list.filter(t=>t.cat===filterCat);
  const done=list.filter(t=>t.done).length, total=list.length, pct=total?Math.round(done/total*100):0;
  $("#modalProgress").firstElementChild.style.width=pct+"%";
  $("#modalFoot").textContent=total?`共 ${total} 项 · 已完成 ${done} 项`:"";
  $("#modalList").innerHTML=buildTodoHTML(list,key);
}

/* ===== 日期导航 ===== */
function renderDatebar(){
  const d=selected, today=new Date(), isT=isSameDay(d,today);
  const lun=Solar.fromDate(d).getLunar();
  $("#curDate").innerHTML=`<div class="d1">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${isT?"· 今天":""}</div>
    <div class="d2">星期${WEEK_CN[d.getDay()]} · ${lun.getMonthInChinese()}月${lun.getDayInChinese()}</div>`;
}

/* ===== 总渲染 ===== */
function render(){
  renderDatebar(); renderAlmanac(selected);
  $("#listView").classList.toggle("hidden",viewMode!=="list");
  $("#monthView").classList.toggle("hidden",viewMode!=="month");
  $("#weekView").classList.toggle("hidden",viewMode!=="week");
  if(viewMode==="list") renderList();
  else if(viewMode==="month") renderMonth();
  else renderWeek();
  if(modalDate) renderModal();
}

/* ===== 事件 ===== */
function shiftDate(n){
  if(viewMode==="month") selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);
  else if(viewMode==="week") selected=new Date(selected.getTime()+n*7*864e5);
  else selected=new Date(selected.getTime()+n*864e5);
  render();
}
$("#prevBtn").addEventListener("click",()=>shiftDate(-1));
$("#nextBtn").addEventListener("click",()=>shiftDate(1));
$("#todayBtn").addEventListener("click",()=>{ selected=new Date(); selected.setHours(0,0,0,0); render(); });
$("#viewSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  viewMode=b.dataset.view;
  [...$("#viewSwitch").children].forEach(x=>x.classList.toggle("active",x===b));
  render();
});
$("#addBtn").addEventListener("click",()=>{ addTodo($("#todoInput").value,fmtKey(selected),$("#catSel").value); $("#todoInput").value=""; $("#todoInput").focus(); });
$("#todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addTodo($("#todoInput").value,fmtKey(selected),$("#catSel").value); $("#todoInput").value=""; }});
$("#clearDone").addEventListener("click",()=>clearDone(fmtKey(selected)));
$("#filterBar").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; filterCat=b.dataset.cat; renderFilterBar(); render(); });

$("#modalAdd").addEventListener("click",()=>{ addTodo($("#modalInput").value,fmtKey(modalDate),$("#modalCatSel").value); $("#modalInput").value=""; $("#modalInput").focus(); });
$("#modalInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addTodo($("#modalInput").value,fmtKey(modalDate),$("#modalCatSel").value); $("#modalInput").value=""; }});
$("#modalClear").addEventListener("click",()=>clearDone(fmtKey(modalDate)));
$("#modalClose").addEventListener("click",closeModal);
$("#modalMask").addEventListener("click",e=>{ if(e.target===$("#modalMask")) closeModal(); });

// 同步设置弹窗
function openSyncModal(){ $("#syncBaseInput").value=syncBase; $("#syncTest").textContent=""; $("#syncModal").classList.remove("hidden"); }
function closeSyncModal(){ $("#syncModal").classList.add("hidden"); }
$("#syncSettingsBtn").addEventListener("click",openSyncModal);
$("#syncModalClose").addEventListener("click",closeSyncModal);
$("#syncModal").addEventListener("click",e=>{ if(e.target===$("#syncModal")) closeSyncModal(); });
$("#syncSave").addEventListener("click",()=>{
  const url=$("#syncBaseInput").value.trim();
  $("#syncTest").textContent="正在连接…";
  setSyncBase(url);
  setTimeout(()=>{ const t=$("#syncTest"); if(online) t.innerHTML='<span style="color:var(--accent-deep)">✓ 已连接，开始同步</span>'; else t.innerHTML='<span style="color:var(--warn)">✗ 连接失败，请确认地址可公网访问且为同步服务根地址</span>'; },900);
  setTimeout(closeSyncModal, 1300);
});
$("#syncClear").addEventListener("click",()=>{ setSyncBase(""); $("#syncBaseInput").value=""; $("#syncTest").textContent="已清除，仅本机存储"; });

bindList("todoList");
bindList("modalList");
// 填充两个分类下拉
[["catSel"],["modalCatSel"]].forEach(([id])=>{ $("#"+id).innerHTML=catOpts("other"); });
renderFilterBar();

/* ===== 启动 ===== */
setSync("off","离线");
render();
pull().then(()=>push());
setInterval(()=>{ pull().then(()=>push()); },5000);
</script>
