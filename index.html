<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>每日待办 · 我的日程本</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#2b2b2e; --ink-soft:#71737a; --ink-faint:#a9abb2;
    --line:#ececef; --line-soft:#f3f3f5;
    --accent:#54a07d; --accent-deep:#3f7d5f; --accent-soft:#eef6f1;
    --warn:#e0685f; --warn-soft:#fdeeed; --gold:#c79a4e;
    --green:#3f9d72; --red:#e0685f;
    --shadow:0 1px 3px rgba(20,20,40,.04), 0 8px 24px rgba(20,20,40,.05);
    --radius:18px;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1160px;margin:0 auto;padding:26px 22px 60px;display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;}

  /* ===== 左侧 sidebar ===== */
  .sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:26px;}
  .brand{padding:2px 4px;}
  .brand-title{font-size:20px;font-weight:700;letter-spacing:.5px;}
  .brand-sub{font-size:12.5px;color:var(--ink-faint);margin-top:5px;line-height:1.6;}

  .date-card{background:linear-gradient(160deg,#eef6f1 0%, #e4f1ea 100%);border:1px solid #dcebe2;border-radius:var(--radius);padding:20px 22px;}
  .dc-date{font-size:46px;font-weight:700;line-height:1;color:var(--accent-deep);letter-spacing:1px;}
  .dc-info{font-size:13.5px;color:var(--ink-soft);margin-top:10px;}
  .dc-lunar{font-size:12.5px;color:#7fa890;margin-top:4px;}

  .side-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .sb-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:12px;letter-spacing:.5px;}

  .cat-list{display:flex;flex-direction:column;gap:2px;}
  .cat-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px;cursor:pointer;transition:.15s;}
  .cat-row:hover{background:var(--line-soft);}
  .cat-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .cat-name{font-size:14px;color:var(--ink);flex:1;}
  .cat-num{font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}

  .alm-box{font-size:13px;line-height:1.7;color:var(--ink-soft);}
  .alm-box .yi{color:var(--green);}
  .alm-box .ji{color:var(--red);}
  .alm-row{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line);}
  .alm-row:first-child{border-top:0;}
  .alm-k{color:var(--ink-faint);width:30px;flex:0 0 auto;font-weight:600;}
  .alm-note{font-size:11px;color:var(--ink-faint);margin-top:12px;line-height:1.6;border-top:1px dashed var(--line);padding-top:10px;}

  /* ===== 右侧 main ===== */
  .main{min-width:0;}
  .main-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .mnav{display:flex;align-items:center;gap:10px;}
  .marrow{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .marrow:hover{border-color:var(--accent);color:var(--accent-deep);}
  .mtitle{font-size:18px;font-weight:600;min-width:130px;text-align:center;}
  .mtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn-ghost{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:9px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;font-family:var(--sans);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep);}
  .btn-primary{border:0;background:var(--accent);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;font-family:var(--sans);box-shadow:0 2px 10px rgba(84,160,125,.3);}
  .btn-primary:hover{background:var(--accent-deep);}
  .view-switch{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
  .view-switch button{border:0;background:transparent;color:var(--ink-soft);font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:.15s;font-family:var(--sans);}
  .view-switch button.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(84,160,125,.3);}

  .main-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-height:480px;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-title h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.5px;}
  .section-title .meta{font-size:12px;color:var(--ink-faint);}

  .filterbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar button{border:1px solid var(--line);background:var(--line-soft);color:var(--ink-soft);font-size:12.5px;padding:5px 13px;border-radius:999px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px;font-family:var(--sans);}
  .filterbar button .dot{width:8px;height:8px;border-radius:50%;}
  .filterbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filterbar button.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5);}

  .add-box{margin-bottom:14px;}
  .add-row{display:flex;gap:10px;}
  .add-row input{flex:1;border:1px solid var(--line);background:var(--line-soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;transition:.18s;font-family:var(--sans);}
  .add-row input:focus{border-color:var(--accent);background:#fff;}
  .cat-sel{border:1px solid var(--line);background:var(--line-soft);border-radius:12px;padding:0 10px;font-size:13px;color:var(--ink-soft);cursor:pointer;outline:none;font-family:var(--sans);}
  .add-row button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 20px;font-size:14px;cursor:pointer;transition:.18s;white-space:nowrap;font-family:var(--sans);}
  .add-row button:hover{background:var(--accent-deep);}

  .todo-list{padding:2px 2px 8px;}
  .day-group{margin-bottom:14px;}
  .day-group:last-child{margin-bottom:0;}
  .day-head{display:flex;align-items:center;gap:10px;padding:6px 10px;margin:4px 0 2px;position:sticky;top:0;background:var(--bg-card);z-index:2;}
  .day-d{font-size:14px;font-weight:700;color:var(--ink);}
  .day-w{font-size:12px;color:var(--ink-faint);}
  .day-cnt{margin-left:auto;font-size:11.5px;color:var(--ink-faint);background:var(--line-soft);padding:2px 9px;border-radius:20px;}
  .todo-item{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;transition:.15s;}
  .todo-item:hover{background:var(--line-soft);}
  .todo-item + .todo-item{border-top:1px solid var(--line);border-radius:0;}
  .todo-item + .todo-item:hover{border-radius:12px;}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-faint);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;}
  .chk:hover{border-color:var(--accent);}
  .chk.done{background:var(--accent);border-color:var(--accent);}
  .chk.done svg{display:block;}
  .chk svg{display:none;}
  .todo-text{flex:1;font-size:14.5px;line-height:1.45;word-break:break-word;cursor:text;}
  .todo-item.done .todo-text{color:var(--ink-faint);text-decoration:line-through;}
  .cat-chip{flex:0 0 auto;font-size:11px;padding:4px 11px;border-radius:999px;font-family:var(--sans);white-space:nowrap;border:1px solid transparent;-webkit-appearance:none;appearance:none;font-weight:600;cursor:pointer;outline:none;background:transparent;}
  .todo-edit-btn{flex:0 0 auto;border:0;background:transparent;color:var(--ink-faint);font-size:13px;cursor:pointer;padding:5px 8px;border-radius:8px;transition:.15s;font-family:var(--sans);}
  .todo-edit-btn:hover{background:var(--line-soft);color:var(--ink);}
  .todo-del-btn{flex:0 0 auto;border:0;background:transparent;color:var(--ink-faint);font-size:13px;cursor:pointer;padding:5px 8px;border-radius:8px;transition:.15s;font-family:var(--sans);display:flex;align-items:center;gap:4px;}
  .todo-del-btn:hover{background:var(--warn-soft);color:var(--warn);}
  .todo-edit{flex:1;border:1px solid var(--accent);border-radius:8px;padding:7px 10px;font-size:14px;outline:none;font-family:var(--sans);}

  .progress{height:6px;background:var(--line);border-radius:999px;margin:4px 4px 10px;overflow:hidden;}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:999px;transition:width .3s;}
  .list-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 4px;font-size:12px;color:var(--ink-faint);}
  .link-btn{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:12px;transition:.15s;font-family:var(--sans);}
  .link-btn:hover{color:var(--warn);}
  .empty{padding:46px 18px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.8;}
  .empty .big{font-size:32px;margin-bottom:8px;opacity:.5;}

  /* ===== 月历 ===== */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .cal-dow{text-align:center;font-size:12.5px;color:var(--ink-faint);padding:4px 0;font-weight:500;}
  .cal-cell{position:relative;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--line-soft);display:flex;flex-direction:column;padding:9px 9px 8px;transition:.15s;cursor:pointer;}
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.other{background:#fafafb;color:var(--ink-faint);opacity:.55;}
  .cal-cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  .cal-cell.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cal-cell.sel .cell-lun{color:rgba(255,255,255,.8);}
  .cal-cell.sel .ci-text{color:#fff;}
  .cal-cell.sel .ci-cat{background:rgba(255,255,255,.22);color:#fff;}
  .cell-head{display:flex;align-items:flex-start;justify-content:space-between;}
  .cell-num{font-size:15px;font-weight:600;line-height:1;}
  .cell-add{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink-faint);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:0 0 auto;}
  .cell-add:hover{border-color:var(--accent);color:var(--accent-deep);}
  .cal-cell.sel .cell-add{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.15);}
  .cell-lun{font-size:10.5px;color:var(--ink-faint);margin-top:3px;font-family:var(--sans);}
  .cell-items{margin-top:8px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .ci{display:flex;align-items:center;gap:6px;background:#fff;border-radius:7px;padding:4px 6px;font-size:11.5px;line-height:1.3;cursor:pointer;}
  .cal-cell.sel .ci{background:rgba(255,255,255,.16);}
  .ci-chk{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink-faint);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .ci-chk.done{background:var(--accent);border-color:var(--accent);}
  .ci-chk.done svg{display:block;width:9px;height:9px;}
  .ci-chk svg{display:none;}
  .ci-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft);}
  .ci.done .ci-text{color:var(--ink-faint);text-decoration:line-through;}
  .ci-cat{flex:0 0 auto;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--line-soft);color:var(--ink-soft);}
  .ci-more{font-size:10.5px;color:var(--ink-faint);padding-left:4px;}

  /* ===== 周历 ===== */
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .cal-week .cal-cell{min-height:150px;}
  .cal-week .wstat{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:6px;}
  .wadd{margin-top:auto;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink-faint);border-radius:8px;padding:5px;font-size:12px;cursor:pointer;transition:.15s;font-family:var(--sans);}
  .wadd:hover{border-color:var(--accent);color:var(--accent-deep);}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(30,30,40,.42);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(2px);}
  .modal{background:var(--card);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.22);width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;font-weight:600;font-family:var(--sans);}
  .modal-head .md{font-size:12px;color:var(--ink-faint);margin-top:2px;font-family:var(--sans);}
  .modal-close{border:0;background:transparent;font-size:22px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:2px 8px;border-radius:8px;}
  .modal-close:hover{background:var(--line-soft);color:var(--ink);}
  .modal-body{overflow-y:auto;padding-bottom:8px;}

  /* ===== 同步状态 ===== */
  .sync-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .sync-stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);transition:.3s;}
  .sync-dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sync-dot.busy{background:var(--gold);}
  .sync-dot.off{background:var(--warn);}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.18s;padding:0;line-height:1;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent-deep);transform:rotate(30deg);}

  .hidden{display:none !important;}
  @media (max-width:880px){
    .wrap{grid-template-columns:1fr;gap:18px;padding:18px 14px 50px;}
    .sidebar{position:static;flex-direction:column;}
    .mtitle{min-width:110px;font-size:16px;}
    .main-card{min-height:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">日常 · 每日待办</div>
      <div class="brand-sub">工作、家庭与生活，一处记录，随时切换。</div>
    </div>
    <div class="date-card" id="dateCard"></div>
    <div class="side-block">
      <div class="sb-title">分类标签</div>
      <div class="cat-list" id="catList"></div>
    </div>
    <div class="side-block">
      <div class="sb-title">今日黄历</div>
      <div class="alm-box" id="almBox"></div>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <main class="main">
    <div class="sync-bar">
      <button class="icon-btn" id="syncSettingsBtn" title="同步设置">⚙</button>
      <div class="sync-stat" id="syncStat" title="同步状态"><span class="sync-dot off" id="syncDot"></span><span id="syncTxt">离线</span></div>
    </div>
    <header class="main-head">
      <div class="mnav">
        <button class="marrow" id="prevBtn">‹</button>
        <div class="mtitle" id="curTitle">2026年8月</div>
        <button class="marrow" id="nextBtn">›</button>
      </div>
      <div class="mtools">
        <button class="btn-ghost" id="todayBtn">今天</button>
        <button class="btn-primary" id="addQuickBtn">＋ 新增待办</button>
        <div class="view-switch" id="viewSwitch">
          <button data-view="month">月历</button>
          <button data-view="week">周历</button>
          <button data-view="list" class="active">清单</button>
        </div>
      </div>
    </header>

    <div class="main-card">
      <!-- 清单视图 -->
      <div id="listView">
        <div class="section-title"><h2 id="listTitle">今日待办</h2><span class="meta" id="listMeta"></span></div>
        <div class="filterbar" id="filterBar"></div>
        <div class="add-box">
          <div class="add-row">
            <input id="todoInput" type="text" placeholder="添加一件待办，回车保存…" maxlength="120" />
            <select id="catSel" class="cat-sel"></select>
            <button id="addBtn">添加</button>
          </div>
        </div>
        <div class="progress" id="progress"><i style="width:0%"></i></div>
        <div class="todo-list" id="todoList"></div>
        <div class="list-foot"><span id="footStat"></span><button class="link-btn" id="clearDone">清除已完成</button></div>
      </div>

      <!-- 月历视图 -->
      <div id="monthView" class="hidden">
        <div class="section-title"><h2 id="monthTitle">月历</h2><span class="meta">点击日期查看 / 编辑当天待办 · 右上「＋」快速新增</span></div>
        <div class="cal-grid" id="monthDow" style="margin-bottom:10px;"></div>
        <div class="cal-grid" id="monthGrid"></div>
      </div>

      <!-- 周历视图 -->
      <div id="weekView" class="hidden">
        <div class="section-title"><h2 id="weekTitle">本周</h2><span class="meta">点击事项编辑 · 底部「＋ 添加」快速新增</span></div>
        <div class="cal-week" id="weekGrid"></div>
      </div>
    </div>
  </main>
</div>

<!-- 日历内编辑弹窗 -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="modalDate">当日待办</h3><div class="md" id="modalLun"></div></div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="add-box" style="padding:14px 18px 0;">
        <div class="add-row">
          <input id="modalInput" type="text" placeholder="添加待办…" maxlength="120" />
          <select id="modalCatSel" class="cat-sel"></select>
          <button id="modalAdd">添加</button>
        </div>
      </div>
      <div class="progress" id="modalProgress" style="margin:12px 18px 6px;"><i style="width:0%"></i></div>
      <div class="todo-list" id="modalList" style="padding:2px 16px 8px;"></div>
      <div class="list-foot" style="padding:0 18px 14px;"><span id="modalFoot"></span><button class="link-btn" id="modalClear">清除已完成</button></div>
    </div>
  </div>
</div>

<!-- 同步设置弹窗 -->
<div class="modal-mask hidden" id="syncModal">
  <div class="modal">
    <div class="modal-head">
      <div><h3>同步设置</h3><div class="md">跨设备实时同步（不依赖同一 WiFi）</div></div>
      <button class="modal-close" id="syncModalClose">×</button>
    </div>
    <div class="modal-body" style="padding:16px 18px 20px;">
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 12px;">
        在此填入<b>同步服务根地址</b>（即运行 server.js 的地址，打开它会返回 <code style="background:var(--line-soft);padding:1px 4px;border-radius:4px;">{"rev":0,"data":{}}</code> 这类 JSON，<b>不是网页前台地址</b>）。<br>
        手机与电脑都打开同一网页、填同一个地址，即可自动同步。<br>
        留空＝只用本机存储（不跨设备）。
      </p>
      <div class="add-row">
        <input id="syncBaseInput" type="url" placeholder="https://你的同步服务地址（需含 /api/todos 接口）" style="flex:1" />
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn-primary" id="syncSave" style="box-shadow:none;border-radius:12px;">保存并连接</button>
        <button class="link-btn" id="syncClear" style="padding:9px 14px;">清除</button>
      </div>
      <div id="syncTest" style="font-size:12px;color:var(--ink-faint);margin-top:10px;"></div>
    </div>
  </div>
</div>

<script src="lunar.js"></script>
<script>
"use strict";
const $=(s)=>document.querySelector(s);
const pad=(n)=>(n<10?"0":"")+n;
const fmtKey=(d)=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const WEEK_CN=["日","一","二","三","四","五","六"];
const DOW_CN=["一","二","三","四","五","六","日"];

const CATS={
  work:  {label:"工作", color:"#2f6fed", bg:"#eaf1fb"},
  family:{label:"家庭", color:"#e08a3c", bg:"#fdf0e3"},
  baby:  {label:"孩子", color:"#ef7aa5", bg:"#fceaf1"},
  other: {label:"生活", color:"#54a07d", bg:"#eef6f1"},
  self:  {label:"自己", color:"#8a6fd6", bg:"#f1ecf9"},
};
const CAT_KEYS=Object.keys(CATS);

/* ===== 状态 ===== */
const STORE_KEY="dailyTodos_v1";
let selected=new Date(); selected.setHours(0,0,0,0);
let viewMode="list";
let filterCat="all";
let modalDate=null;

/* ===== 存储 + 跨设备同步 ===== */
function loadAll(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function getDayTodos(key){ return (loadAll()[key]||[]).filter(t=>!t.deleted); }
function setDayTodos(key, list){
  const all=loadAll();
  const tomb=(all[key]||[]).filter(t=>t.deleted);
  const merged=tomb.concat(list.map(t=>({...t,deleted:false})));
  if(merged.length) all[key]=merged; else delete all[key];
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
}
function getAllForDay(key){ return (loadAll()[key]||[]); }
function saveDayTodos(key, list){
  const all=loadAll();
  if(list.length) all[key]=list; else delete all[key];
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
}
function mergeFromServer(serverData){
  const all=loadAll(); let changed=false;
  for(const [date,items] of Object.entries(serverData||{})){
    const map=new Map((all[date]||[]).map(t=>[t.id,t]));
    for(const t of items){
      const ex=map.get(t.id);
      if(!ex || (t.updatedAt||0)>=(ex.updatedAt||0)){ if(JSON.stringify(ex)!==JSON.stringify(t)) changed=true; map.set(t.id,t); }
    }
    const arr=[...map.values()].filter(t=>!(t.deleted && Date.now()-(t.updatedAt||0)>7*864e5));
    if(arr.length) all[date]=arr; else delete all[date];
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(all));
  return changed;
}
let online=false, lastRev=-1, syncing=false;
const SYNC_KEY="dailyTodos_syncBase";
let syncBase=(localStorage.getItem(SYNC_KEY)||"").replace(/\/+$/,"");
function apiUrl(p){ return (syncBase?syncBase:"")+p; }
function setSyncBase(url){
  syncBase=(url||"").trim().replace(/\/+$/,"");
  if(syncBase) localStorage.setItem(SYNC_KEY,syncBase); else localStorage.removeItem(SYNC_KEY);
  lastRev=-1; setSync("busy","连接中"); pull().then(()=>push());
}
function setSync(state,txt){
  online=state!=="off";
  $("#syncDot").className="sync-dot "+(state==="on"?"on":state==="busy"?"busy":"off");
  $("#syncTxt").textContent=txt;
}
async function pull(){
  if(syncing) return;
  try{
    const r=await fetch(apiUrl("/api/todos"),{cache:"no-store"});
    if(!r.ok){ setSync("off","离线"); return; }
    const d=await r.json();
    setSync("on","已同步");
    if(d.rev!==lastRev){ const changed=mergeFromServer(d.data); lastRev=d.rev; if(changed) render(); }
  }catch(e){ setSync("off","离线"); }
}
async function push(){
  if(!online) return;
  syncing=true; setSync("busy","同步中");
  try{
    const r=await fetch(apiUrl("/api/todos"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:loadAll()})});
    if(r.ok){ const d=await r.json(); lastRev=d.rev; setSync("on","已同步"); }
    else setSync("off","离线");
  }catch(e){ setSync("off","离线"); }
  syncing=false;
}
function afterMutate(){ localStorage.setItem(STORE_KEY, JSON.stringify(loadAll())); push(); }

/* ===== 待办操作 ===== */
function stamp(t){ t.updatedAt=Date.now(); return t; }
function addTodo(text,key,cat){
  text=text.trim(); if(!text) return;
  key=key||fmtKey(selected); cat=cat||"other";
  const list=getDayTodos(key);
  list.push(stamp({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),text,done:false,cat,createdAt:Date.now()}));
  setDayTodos(key,list); afterMutate(); render();
}
function toggleTodo(id,key){
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.done=!t.done; t.doneAt=t.done?Date.now():null; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function editTodo(id,key,newText){
  newText=newText.trim(); if(!newText) return;
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.text=newText; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function setCat(id,key,cat){
  key=key||fmtKey(selected);
  const list=getDayTodos(key).map(t=>{ if(t.id===id){t.cat=cat; stamp(t);} return t; });
  setDayTodos(key,list); afterMutate(); render();
}
function delTodo(id,key){
  key=key||fmtKey(selected);
  const list=getAllForDay(key).map(t=>{ if(t.id===id){t.deleted=true; stamp(t);} return t; });
  saveDayTodos(key,list); afterMutate(); render();
}
function clearDone(key){
  key=key||fmtKey(selected);
  const list=getAllForDay(key).map(t=>{ if(t.done){t.deleted=true; stamp(t);} return t; });
  saveDayTodos(key,list); afterMutate(); render();
}
function clearDoneAll(){
  const all=loadAll();
  Object.keys(all).forEach(key=>{
    const list=getAllForDay(key).map(t=>{ if(t.done){t.deleted=true; stamp(t);} return t; });
    saveDayTodos(key,list);
  });
  afterMutate(); render();
}

/* ===== 黄历 ===== */
function renderAlmanac(d){
  const solar=Solar.fromDate(d), lunar=solar.getLunar();
  const sxz=lunar.getYearShengXiao();
  const mGz=lunar.getMonthInGanZhi(), dGz=lunar.getDayInGanZhi();
  const yi=lunar.getDayYi().join(" "), ji=lunar.getDayJi().join(" ");
  const chong=lunar.getDayChong(), sha=lunar.getDaySha();
  const tianshen=lunar.getDayTianShen(), nayin=lunar.getDayNaYin();
  const pz=lunar.getPengZuGan()+" "+lunar.getPengZuZhi();
  const jq=lunar.getJieQi()||"";
  const fest=(lunar.getFestivals().concat(lunar.getOtherFestivals())).join(" ");
  const sfest=(solar.getFestivals&&solar.getFestivals())||[];
  const lunarStr=lunar.getYearInChinese()+"年 "+lunar.getMonthInChinese()+"月"+lunar.getDayInChinese();
  let festLine="";
  if(jq) festLine+="【"+jq+"】";
  if(fest) festLine+=fest;
  if(sfest.length) festLine+=sfest.join(" ");
  $("#almBox").innerHTML=`
    <div class="alm-row"><span class="alm-k">农历</span><span>${lunarStr}<br><span style="color:var(--ink-faint)">${mGz}月 ${dGz}日</span></span></div>
    ${festLine?`<div class="alm-row"><span class="alm-k">节日</span><span style="color:var(--warn)">${festLine}</span></div>`:""}
    <div class="alm-row"><span class="alm-k">宜</span><span class="yi">${yi||"—"}</span></div>
    <div class="alm-row"><span class="alm-k">忌</span><span class="ji">${ji||"—"}</span></div>
    <div class="alm-row"><span class="alm-k">冲煞</span><span>冲${chong}煞${sha}</span></div>
    <div class="alm-row"><span class="alm-k">值神</span><span>${tianshen} · 纳音${nayin}</span></div>
    <div class="alm-note">彭祖百忌：${pz}</div>`;
}

/* ===== 工具 ===== */
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function checkSvg(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`; }
function trashSvg(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`; }
function catOpts(cur){ return CAT_KEYS.map(k=>`<option value="${k}" ${k===cur?"selected":""}>${CATS[k].label}</option>`).join(""); }

function buildTodoHTML(list,key){
  if(!list.length) return `<div class="empty"><div class="big">☘</div>这一天还没有安排<br>点下方或日历里的「＋」添加</div>`;
  const sorted=[...list].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.createdAt-b.createdAt));
  return sorted.map(t=>{
    const c=CATS[t.cat]||CATS.other;
    return `<div class="todo-item ${t.done?"done":""}" data-id="${t.id}" data-key="${key}">
      <div class="chk ${t.done?"done":""}" data-act="toggle">${checkSvg()}</div>
      <div class="todo-text" data-act="edit" title="双击编辑">${escapeHtml(t.text)}</div>
      <select class="cat-chip" data-act="cat" style="background:${c.bg};color:${c.color};border-color:${c.color}" title="点击修改分类">${catOpts(t.cat)}</select>
      <button class="todo-edit-btn" data-act="edit">编辑</button>
      <button class="todo-del-btn" data-act="del" title="删除">${trashSvg()}<span>删除</span></button>
    </div>`;
  }).join("");
}
function bindList(containerId){
  const c=$("#"+containerId);
  c.addEventListener("click",e=>{
    const item=e.target.closest(".todo-item"); if(!item) return;
    const id=item.dataset.id, key=item.dataset.key, act=e.target.dataset.act;
    if(act==="toggle") toggleTodo(id,key);
    else if(act==="del") delTodo(id,key);
    else if(act==="edit"){
      if(item.classList.contains("done")) return;
      startEdit(item,item.querySelector(".todo-text"));
    }
  });
  c.addEventListener("change",e=>{
    const sel=e.target.closest(".cat-chip"); if(!sel) return;
    const item=e.target.closest(".todo-item"); if(!item) return;
    setCat(item.dataset.id,item.dataset.key,sel.value);
  });
  c.addEventListener("dblclick",e=>{
    const txt=e.target.closest(".todo-text"); if(!txt) return;
    const item=txt.closest(".todo-item"); if(item.classList.contains("done")) return;
    startEdit(item,txt);
  });
}
function startEdit(item,txt){
  const id=item.dataset.id, key=item.dataset.key;
  const t=getDayTodos(key).find(x=>x.id===id); if(!t) return;
  const input=document.createElement("input");
  input.className="todo-edit"; input.value=t.text;
  txt.replaceWith(input); input.focus(); input.select();
  let done=false;
  const commit=()=>{ if(done) return; done=true; const v=input.value.trim(); if(v) editTodo(id,key,v); else render(); };
  input.addEventListener("blur",commit);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();input.blur();} else if(e.key==="Escape"){done=true;render();} });
}

/* ===== 列表（清单）视图 ===== */
function renderFilterBar(){
  const bar=$("#filterBar");
  const items=[["all","全部"]].concat(CAT_KEYS.map(k=>[k,CATS[k].label]));
  bar.innerHTML=items.map(([k,l])=>{
    const dot=k==="all"?"":`<span class="dot" style="background:${CATS[k].color}"></span>`;
    return `<button class="${filterCat===k?"active":""}" data-cat="${k}">${dot}${l}</button>`;
  }).join("");
}
function renderList(){
  const all=loadAll();
  const groups=[];
  Object.keys(all).sort().forEach(key=>{
    let items=(all[key]||[]).filter(t=>!t.deleted);
    if(filterCat!=="all") items=items.filter(t=>t.cat===filterCat);
    if(!items.length) return;
    const p=key.split("-"); const date=new Date(+p[0],+p[1]-1,+p[2]);
    items.sort((a,b)=>(a.done?1:0)-(b.done?1:0)|| ((a.createdAt||0)-(b.createdAt||0)));
    groups.push({key,date,items});
  });
  groups.sort((a,b)=>a.date-b.date);
  const total=groups.reduce((s,g)=>s+g.items.length,0);
  const done=groups.reduce((s,g)=>s+g.items.filter(t=>t.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  $("#listTitle").textContent="待办清单";
  $("#listMeta").textContent= total? `${total} 项 · 已完成 ${done} 项` : "";
  $("#footStat").textContent= total? `共 ${total} 项 · 已完成 ${done} 项` : "";
  $("#progress").firstElementChild.style.width=pct+"%";
  if(!groups.length){
    $("#todoList").innerHTML=`<div class="empty"><div class="big">☘</div>还没有任何待办<br>在下方或日历里点「＋」添加</div>`;
    return;
  }
  $("#todoList").innerHTML=groups.map(g=>{
    const m=g.date.getMonth()+1, d=g.date.getDate();
    const w=WEEK_CN[g.date.getDay()];
    const isT=isSameDay(g.date,new Date());
    const cnt=g.items.length, dc=g.items.filter(t=>t.done).length;
    return `<div class="day-group">
      <div class="day-head"><span class="day-d">${m}月${d}日</span><span class="day-w">周${w}${isT?" · 今天":""}</span><span class="day-cnt">${dc}/${cnt}</span></div>
      ${buildTodoHTML(g.items,g.key)}
    </div>`;
  }).join("");
}

/* ===== 左侧 sidebar 渲染 ===== */
function renderSidebar(){
  const d=selected, today=new Date(); today.setHours(0,0,0,0);
  const lun=Solar.fromDate(d).getLunar();
  const isT=isSameDay(d,today);
  $("#dateCard").innerHTML=`<div class="dc-date">${d.getMonth()+1}/${d.getDate()}</div>
    <div class="dc-info">星期${WEEK_CN[d.getDay()]}${isT?" · 今天":""} · ${d.getFullYear()}年</div>
    <div class="dc-lunar">农历：${lun.getMonthInChinese()}月${lun.getDayInChinese()}</div>`;
  renderCatStats();
  renderAlmanac(d);
}
function renderCatStats(){
  const all=loadAll();
  const counts={}; CAT_KEYS.forEach(k=>counts[k]=0);
  Object.values(all).forEach(arr=>arr.forEach(t=>{ if(!t.deleted && counts[t.cat]!==undefined) counts[t.cat]++; }));
  $("#catList").innerHTML=CAT_KEYS.map(k=>{
    const c=CATS[k];
    return `<div class="cat-row" data-cat="${k}"><span class="cat-dot" style="background:${c.color}"></span><span class="cat-name">${c.label}</span><span class="cat-num">${counts[k]}</span></div>`;
  }).join("");
}

/* ===== 日历通用 ===== */
function statHTML(list){
  const total=list.length, done=list.filter(t=>t.done).length, pend=total-done;
  if(!total) return "";
  return `<div class="cellstat" style="margin-top:auto;font-size:10px;color:var(--ink-faint)">${pend?`待${pend}`:""}${done?` ✓${done}`:""}</div>`;
}
function renderMonth(){
  const y=selected.getFullYear(), m=selected.getMonth();
  $("#monthTitle").textContent=y+"年"+(m+1)+"月";
  $("#curTitle").textContent=y+"年"+(m+1)+"月";
  $("#monthDow").innerHTML=DOW_CN.map(w=>`<div class="cal-dow">周${w}</div>`).join("");
  const first=new Date(y,m,1);
  const start=new Date(y,m,1); start.setDate(1-((first.getDay()+6)%7));
  const today=new Date(); today.setHours(0,0,0,0);
  const grid=$("#monthGrid"); grid.innerHTML="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=fmtKey(d), list=getDayTodos(key);
    const cell=document.createElement("div"); cell.className="cal-cell";
    if(d.getMonth()!==m) cell.classList.add("other");
    if(isSameDay(d,today)) cell.classList.add("today");
    if(isSameDay(d,selected)) cell.classList.add("sel");
    const lun=Solar.fromDate(d).getLunar();
    const lunTxt=lun.getDay()===1? lun.getMonthInChinese()+"月" : lun.getDayInChinese();
    let items="";
    list.slice(0,3).forEach(t=>{
      const c=CATS[t.cat]||CATS.other;
      items+=`<div class="ci ${t.done?"done":""}" data-id="${t.id}">
        <span class="ci-chk ${t.done?"done":""}" data-act="toggle-ci"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        <span class="ci-text">${escapeHtml(t.text)}</span>
        <span class="ci-cat" style="background:${c.bg};color:${c.color}">${c.label}</span>
      </div>`;
    });
    if(list.length>3) items+=`<div class="ci-more">+${list.length-3} 项</div>`;
    cell.innerHTML=`<div class="cell-head"><span class="cell-num">${d.getDate()}</span><button class="cell-add" data-act="add" title="新增">＋</button></div>
      <div class="cell-lun">${lunTxt}</div>
      <div class="cell-items">${items}</div>`;
    cell.addEventListener("click",e=>{
      if(e.target.closest(".cell-add")){ openModal(d,true); return; }
      const ci=e.target.closest(".ci");
      if(ci){
        if(e.target.closest('[data-act="toggle-ci"]')){ toggleTodo(ci.dataset.id,key); return; }
        openModal(d); return;
      }
      openModal(d);
    });
    grid.appendChild(cell);
  }
}
function renderWeek(){
  const monday=new Date(selected); monday.setDate(selected.getDate()-((selected.getDay()+6)%7));
  $("#weekTitle").textContent=fmtKey(monday).slice(5)+" ~ "+fmtKey(new Date(monday.getTime()+6*864e5)).slice(5);
  $("#curTitle").textContent=fmtKey(monday).slice(0,7).replace("-","年")+"月";
  const grid=$("#weekGrid"); grid.innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const key=fmtKey(d), list=getDayTodos(key);
    const total=list.length, done=list.filter(t=>t.done).length;
    const cell=document.createElement("div"); cell.className="cal-cell";
    const today=new Date(); today.setHours(0,0,0,0);
    if(isSameDay(d,today)) cell.classList.add("today");
    if(isSameDay(d,selected)) cell.classList.add("sel");
    const lun=Solar.fromDate(d).getLunar();
    const lunTxt=lun.getDay()===1? lun.getMonthInChinese()+"月" : lun.getDayInChinese();
    let items="";
    list.slice(0,4).forEach(t=>{ const c=CATS[t.cat]||CATS.other; items+=`<div class="ci ${t.done?"done":""}" data-id="${t.id}"><span class="ci-chk ${t.done?"done":""}" data-act="toggle-ci"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="ci-text">${escapeHtml(t.text)}</span></div>`; });
    if(total>4) items+=`<div class="ci-more">+${total-4} 项</div>`;
    cell.innerHTML=`<div class="cell-head"><span class="cell-num">${d.getDate()}</span><button class="cell-add" data-act="add">＋</button></div>
      <div class="cell-lun">周${DOW_CN[i]}·${lunTxt}</div>
      <div class="cell-items">${items}</div>
      ${total?`<div class="wstat">待${total-done} · 已完成${done}</div>`:""}
      <button class="wadd" data-act="add">＋ 添加</button>`;
    cell.addEventListener("click",e=>{
      if(e.target.closest('[data-act="add"]')){ openModal(d,true); return; }
      const ci=e.target.closest(".ci");
      if(ci){ if(e.target.closest('[data-act="toggle-ci"]')){ toggleTodo(ci.dataset.id,key); return; } openModal(d); return; }
      openModal(d);
    });
    grid.appendChild(cell);
  }
}

/* ===== 弹窗（日历内编辑当日） ===== */
function openModal(date,focusAdd){
  modalDate=new Date(date); modalDate.setHours(0,0,0,0);
  const lun=Solar.fromDate(modalDate).getLunar();
  $("#modalDate").textContent=fmtKey(modalDate).replace(/-/g,"/")+" 当日待办";
  $("#modalLun").textContent="星期"+WEEK_CN[modalDate.getDay()]+" · "+lun.getMonthInChinese()+"月"+lun.getDayInChinese();
  $("#modalMask").classList.remove("hidden");
  renderModal();
  if(focusAdd) setTimeout(()=>$("#modalInput").focus(),60);
}
function closeModal(){ modalDate=null; $("#modalMask").classList.add("hidden"); }
function renderModal(){
  if(!modalDate) return;
  const key=fmtKey(modalDate);
  let list=getDayTodos(key);
  if(filterCat!=="all") list=list.filter(t=>t.cat===filterCat);
  const done=list.filter(t=>t.done).length, total=list.length, pct=total?Math.round(done/total*100):0;
  $("#modalProgress").firstElementChild.style.width=pct+"%";
  $("#modalFoot").textContent=total?`共 ${total} 项 · 已完成 ${done} 项`:"";
  $("#modalList").innerHTML=buildTodoHTML(list,key);
}

/* ===== 总渲染 ===== */
function render(){
  renderSidebar();
  $("#listView").classList.toggle("hidden",viewMode!=="list");
  $("#monthView").classList.toggle("hidden",viewMode!=="month");
  $("#weekView").classList.toggle("hidden",viewMode!=="week");
  if(viewMode==="list") renderList();
  else if(viewMode==="month"){ renderMonth(); }
  else { renderWeek(); }
  if(modalDate) renderModal();
}

/* ===== 事件 ===== */
function shiftDate(n){
  if(viewMode==="month") selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);
  else if(viewMode==="week") selected=new Date(selected.getTime()+n*7*864e5);
  else selected=new Date(selected.getTime()+n*864e5);
  render();
}
$("#prevBtn").addEventListener("click",()=>shiftDate(-1));
$("#nextBtn").addEventListener("click",()=>shiftDate(1));
$("#todayBtn").addEventListener("click",()=>{ selected=new Date(); selected.setHours(0,0,0,0); render(); });
$("#viewSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  viewMode=b.dataset.view;
  [...$("#viewSwitch").children].forEach(x=>x.classList.toggle("active",x===b));
  render();
});
$("#addBtn").addEventListener("click",()=>{ addTodo($("#todoInput").value,fmtKey(new Date()),$("#catSel").value); $("#todoInput").value=""; $("#todoInput").focus(); });
$("#todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addTodo($("#todoInput").value,fmtKey(new Date()),$("#catSel").value); $("#todoInput").value=""; }});
$("#clearDone").addEventListener("click",()=>clearDoneAll());
$("#filterBar").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; filterCat=b.dataset.cat; renderFilterBar(); render(); });
$("#catList").addEventListener("click",e=>{ const r=e.target.closest(".cat-row"); if(!r) return; filterCat=r.dataset.cat; renderFilterBar(); if(viewMode!=="list"){ viewMode="list"; [...$("#viewSwitch").children].forEach(x=>x.classList.toggle("active",x.dataset.view==="list")); } render(); });
$("#addQuickBtn").addEventListener("click",()=>{
  if(viewMode!=="list"){ viewMode="list"; [...$("#viewSwitch").children].forEach(x=>x.classList.toggle("active",x.dataset.view==="list")); render(); }
  $("#todoInput").focus();
});

$("#modalAdd").addEventListener("click",()=>{ addTodo($("#modalInput").value,fmtKey(modalDate),$("#modalCatSel").value); $("#modalInput").value=""; $("#modalInput").focus(); });
$("#modalInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ addTodo($("#modalInput").value,fmtKey(modalDate),$("#modalCatSel").value); $("#modalInput").value=""; }});
$("#modalClear").addEventListener("click",()=>clearDone(fmtKey(modalDate)));
$("#modalClose").addEventListener("click",closeModal);
$("#modalMask").addEventListener("click",e=>{ if(e.target===$("#modalMask")) closeModal(); });

// 同步设置弹窗
function openSyncModal(){ $("#syncBaseInput").value=syncBase; $("#syncTest").textContent=""; $("#syncModal").classList.remove("hidden"); }
function closeSyncModal(){ $("#syncModal").classList.add("hidden"); }
$("#syncSettingsBtn").addEventListener("click",openSyncModal);
$("#syncModalClose").addEventListener("click",closeSyncModal);
$("#syncModal").addEventListener("click",e=>{ if(e.target===$("#syncModal")) closeSyncModal(); });
$("#syncSave").addEventListener("click",()=>{
  const url=$("#syncBaseInput").value.trim();
  $("#syncTest").textContent="正在连接…";
  setSyncBase(url);
  setTimeout(()=>{ const t=$("#syncTest"); if(online) t.innerHTML='<span style="color:var(--accent-deep)">✓ 已连接，开始同步</span>'; else t.innerHTML='<span style="color:var(--warn)">✗ 连接失败，请确认地址可公网访问且为同步服务根地址</span>'; },900);
  setTimeout(closeSyncModal, 1300);
});
$("#syncClear").addEventListener("click",()=>{ setSyncBase(""); $("#syncBaseInput").value=""; $("#syncTest").textContent="已清除，仅本机存储"; });

bindList("todoList");
bindList("modalList");
[["catSel"],["modalCatSel"]].forEach(([id])=>{ $("#"+id).innerHTML=catOpts("other"); });
renderFilterBar();

/* ===== 启动 ===== */
setSync("off","离线");
render();
pull().then(()=>push());
setInterval(()=>{ pull().then(()=>push()); },5000);
</script>
</body>
</html>
